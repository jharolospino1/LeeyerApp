-- LeeyerApp · Notificaciones push (Firebase) — ejecuta TODO en Supabase → SQL Editor → Run
-- (se puede ejecutar varias veces sin problema)

create table if not exists public.push_tokens (
  token text primary key,
  user_id uuid not null references auth.users(id) on delete cascade,
  platform text not null default 'android',
  prefs jsonb not null default '{"m":1,"u":1,"g":1}'::jsonb,   -- m=materiales, u=actualizaciones, g=generales
  updated_at timestamptz not null default now()
);
create index if not exists push_tokens_user_idx on public.push_tokens(user_id);

-- Clave de servicio de Firebase: sin políticas = la app nunca puede leerla.
create table if not exists public.push_secrets (
  id text primary key default 'main',
  service_account text,
  updated_at timestamptz not null default now()
);
insert into public.push_secrets(id) values('main') on conflict do nothing;

alter table public.push_tokens  enable row level security;
alter table public.push_secrets enable row level security;
revoke all on public.push_tokens  from anon, authenticated;
revoke all on public.push_secrets from anon, authenticated;

-- La app registra/borra el token del teléfono SOLO mediante estas funciones
create or replace function public.register_push_token(p_token text, p_prefs jsonb default '{"m":1,"u":1,"g":1}'::jsonb)
returns void language plpgsql security definer set search_path = public as $$
begin
  if auth.uid() is null then raise exception 'not authenticated'; end if;
  if p_token is null or length(p_token) < 20 or length(p_token) > 4096 then raise exception 'invalid token'; end if;
  insert into public.push_tokens(token, user_id, prefs, updated_at)
  values (p_token, auth.uid(), coalesce(p_prefs, '{}'::jsonb), now())
  on conflict (token) do update set user_id = auth.uid(), prefs = coalesce(p_prefs, '{}'::jsonb), updated_at = now();
end $$;

create or replace function public.unregister_push_token(p_token text)
returns void language plpgsql security definer set search_path = public as $$
begin
  if auth.uid() is null then return; end if;
  delete from public.push_tokens where token = p_token and user_id = auth.uid();
end $$;

revoke all on function public.register_push_token(text, jsonb) from public, anon;
revoke all on function public.unregister_push_token(text) from public, anon;
grant execute on function public.register_push_token(text, jsonb) to authenticated;
grant execute on function public.unregister_push_token(text) to authenticated;
