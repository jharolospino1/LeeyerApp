@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F3F4FA;--card:#fff;--c2:#EEF0FA;--line:#D9DDEE;--ink:#141A2E;--mut:#5B6580;--acc:#5B3DE0;--accs:#5B3DE0;--ok:#0F8A5F;--no:#C0343F;--okbg:#E2F5EE;--nobg:#FBE8EA}}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{height:100%;background:var(--bg);overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,.nav,.top,.rh{-webkit-user-select:none;user-select:none}
main{flex:1 1 auto;min-height:0;width:100%;max-width:640px;margin:0 auto;padding:0 16px 28px;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accs);outline-offset:2px}
h1,h2,h3,p{margin:0}.i{flex:none;vertical-align:middle}
.top{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:4;margin:0 -16px 12px;padding:12px 16px 10px;background:var(--bg)}
.logo{flex:none;width:36px;height:36px;display:block}.logo svg{width:100%;height:100%}
.tt{min-width:0}.top h1{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.05}.top h1 b,.dh h1 b{color:var(--accs)}
.top small{color:var(--mut);font-size:10.5px;display:block}.sp{flex:1}
.ib{position:relative;flex:none;width:38px;height:38px;border-radius:50%;border:0;background:none;display:grid;place-items:center}
.ib.av{background:var(--c2);color:var(--accs)}
.dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--acc)}

.hero p{color:var(--mut)}.hero .hs{max-width:68%;margin-top:6px}
.hero h2{font-size:27px;font-weight:800;line-height:1.15;margin:8px 0;max-width:80%}.hero h2 span{color:var(--accs)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.hero .btn{margin-top:16px}.wide{width:100%;margin-top:12px}
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:22px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 3px 10px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:6px}
.qa svg{color:var(--accs)}.qa b{font-size:11px}.qa small{color:var(--mut);font-size:9.5px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
.sec h2{font-size:24px;font-weight:800;border-left:4px solid var(--acc);padding-left:10px;line-height:1.1}
.lnk{background:none;border:0;color:var(--accs);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:22px}
@media(max-width:430px){.mat{flex-direction:column;align-items:flex-start;gap:10px;position:relative;padding:12px;min-width:0}.mat .ic{width:42px;height:42px}.mat>.i:last-child{position:absolute;top:12px;right:10px}.mt{width:100%;min-width:0}.mat b{overflow-wrap:anywhere;font-size:14px}.sc{min-height:0}}
.mat{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;min-height:68px}
.mat .ic{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff}
.mt{flex:1;min-width:0}.mat b{display:block;font-size:14px;line-height:1.2}.mat small{color:var(--mut);font-size:12px}.mat>.i{color:var(--mut)}
.feat{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}

.fi{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;color:#fff;align-self:flex-start}
.tg{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:rgba(109,74,245,.2);color:var(--accs)}
.tg.gr{background:rgba(22,163,74,.2);color:#4ADE80}
.ghost{background:none;border:1.5px solid var(--acc);color:var(--accs);border-radius:99px;padding:6px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.ghost.gr{border-color:#16A34A;color:#4ADE80}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row b{display:block;margin:5px 0 1px}.row small{color:var(--mut)}
.nav{position:relative;flex:none;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11.5px;font-weight:600;padding:2px 0 6px;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav .on{color:var(--accs)}.nav .on:after{content:"";position:absolute;bottom:-2px;width:34px;height:3px;border-radius:3px;background:var(--acc)}
.back{background:none;border:0;color:var(--accs);font-weight:700;padding:4px 0;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.opt.r{border-color:var(--ok);background:var(--okbg)}.opt.w{border-color:var(--no);background:var(--nobg)}
.lesson{border-left:4px solid var(--acc);padding-left:12px;margin:12px 0;color:var(--mut)}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
ul{padding-left:20px;margin:10px 0}li{margin-bottom:6px}
.big{font-size:54px;font-weight:800;line-height:1.1}.mut{color:var(--mut)}.c{text-align:center}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.dr-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(76%,360px);background:var(--bg);border-right:1px solid var(--line);transform:translateX(-102%);visibility:hidden;transition:transform .25s,visibility 0s .25s;z-index:10;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px))}
.open .dr{transform:none;visibility:visible;transition:transform .25s}.open .dr-bg{opacity:1;pointer-events:auto}
.dh{display:flex;align-items:center;gap:10px}.dh .logo{width:52px;height:52px}.dh h1{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1}.dh small{color:var(--mut);font-size:11px}
.usr{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;text-align:left;padding:10px 2px;margin:16px 0 12px}
.avr{flex:none;width:62px;height:62px;border-radius:50%;border:3px solid var(--acc);box-shadow:0 0 14px rgba(109,74,245,.5);display:grid;place-items:center;background:var(--c2);color:var(--accs)}
.usr b{display:block;font-size:17px}.usr small{color:var(--accs)}.usr>.i{color:var(--mut)}
.mi{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-radius:12px;padding:13px 12px;font-weight:600;text-align:left;font-size:16px;margin-bottom:2px}
.mi span{flex:1}.mi>.i:last-child{color:var(--mut)}.mi.on{background:linear-gradient(90deg,rgba(109,74,245,.45),rgba(109,74,245,.18));border-left:4px solid var(--acc)}.mi.on .i{color:var(--accs)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.quote{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card)}.quote svg{color:var(--accs)}.quote b{display:block;font-size:15px;line-height:1.3}.quote small{color:var(--accs);font-weight:600}
@media(prefers-reduced-motion:reduce){.dr,.dr-bg{transition:none}}
.mh{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.mh .ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}.mh h2{font-size:26px;font-weight:800;line-height:1.1}details.card summary{cursor:pointer;font-weight:700}.sc{min-height:76px}
.pc{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;background:linear-gradient(180deg,rgba(109,74,245,.12),transparent),var(--card)}
.pf{display:flex;align-items:center;gap:14px}.pf .avr{width:62px;height:62px;border-width:3px}.pf h3{font-size:20px;font-weight:800}.pf small{color:var(--accs);font-size:14px;display:block}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(109,74,245,.2);color:var(--accs);border-radius:99px;padding:4px 11px;font-size:12px;margin-top:6px}
.ob{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px solid var(--acc);color:var(--accs);border-radius:99px;padding:8px 12px;font-weight:600;font-size:12.5px;flex:none;align-self:flex-start}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}.ph>svg{color:var(--accs)}.ph b{font-size:17px;font-weight:700;flex:1}.ph .pct{font-size:26px;font-weight:800;color:var(--accs);line-height:1;display:block;text-align:right}.ph small{display:block;text-align:right;color:var(--mut);font-size:12px}
.pb{height:10px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}.pb i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#5B3DE0,#8F78FF)}
.st4{display:grid;grid-template-columns:repeat(4,1fr)}.st4>div{text-align:center;padding:2px 4px;border-left:1px solid var(--line);font-size:11px;color:var(--mut);line-height:1.25}.st4>div:first-child{border:0}.st4 svg{color:var(--accs)}.st4 b{display:block;font-size:18px;color:var(--ink);margin:2px 0}.st4 small{display:block}
.bds{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;padding:14px 2px}
.bg{text-align:center;padding:0 6px;border-left:1px solid var(--line);font-size:11px;color:var(--mut);line-height:1.25}.bg:first-child{border:0}.bg b{display:block;color:var(--ink);font-size:13.5px;margin:6px 0 2px}
.bd{position:relative;flex:none;width:58px;height:62px;margin:0 auto}.bd .hx{width:100%;height:100%;filter:drop-shadow(0 0 6px var(--c))}.bd .bi{position:absolute;inset:0;display:grid;place-items:center;color:#fff}.bd .sr{position:absolute;bottom:3px;left:0;right:0;text-align:center;color:#FFC83D;font-size:10px}.bd.off{filter:grayscale(1);opacity:.4}
.ml{border:1px solid var(--line);border-radius:18px;padding:2px 14px;margin-bottom:14px;background:var(--card)}
.mr{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;text-align:left;font-size:14.5px}.mr:last-child{border:0}.mr .mi2{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}.mr .t{flex:1}.mr>.i{color:var(--mut)}
.lo{width:100%;background:none;border:1.5px solid var(--acc);color:var(--ink);border-radius:99px;padding:13px;font-weight:600;display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:8px}.lo svg{color:var(--accs)}
.dayg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dayg span{aspect-ratio:1;border-radius:8px;background:var(--line);display:grid;place-items:center;font-size:12px;color:var(--mut)}.dayg .a{background:var(--acc);color:#fff}
select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:inherit;font:inherit}
.rh{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:4;margin:0 -16px 12px;padding:10px 16px;background:var(--bg)}
.binfo{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:14px}.binfo .cv{width:56px;height:78px}.binfo h2{font-size:17px;font-weight:700;line-height:1.2}.bm{flex:1;min-width:0}.bm .tg{margin-top:6px}
.pill{border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:12px;background:var(--card);white-space:nowrap}

.cv.cg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(160deg,#1B2447,#0B1020);border:1px solid #3A4570;color:#E8C97A;text-align:center;font-size:7.5px;padding:6px;line-height:1.2}
.pgc{margin:0 0 8px auto;width:96px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;font-size:14px}.pb2{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}.pb2 i{display:block;height:100%;background:var(--acc)}
.paper{background:#F7F8FC;color:#14182B;border-radius:6px;padding:22px 20px 14px;font-family:"Times New Roman",Georgia,serif;text-align:justify;line-height:1.5;box-shadow:0 2px 20px rgba(0,0,0,.4);margin-bottom:14px;min-height:55vh}
.paper p{margin:0 0 12px}.paper .pt{text-align:center;font-size:.95em;margin-bottom:6px}.paper .ph2{text-align:center;font-weight:700;margin-bottom:16px}.paper ul{padding-left:26px}.paper .nt{font-style:italic;font-size:.85em;color:#555}
.pf2{border-top:2px solid #7C5CFF;margin-top:18px;padding-top:6px;text-align:right;font-size:.85em}
.paper.dk{background:#12182B;color:#E8ECF6}.paper.dk .nt{color:#9AA3BD}
.rm{padding-bottom:250px}
.rbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:4}
.rnav{display:flex;align-items:center;justify-content:space-between;margin:8px 12px 4px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.rnav button{background:none;border:0;display:inline-flex;align-items:center;gap:4px;font-weight:600}.rnav button:disabled{opacity:.35}
.pn{display:inline-flex;align-items:center;gap:6px;color:var(--mut)}.pn input{width:54px;text-align:center;padding:6px;color:var(--ink);-moz-appearance:textfield}
.rtool{display:grid;grid-template-columns:repeat(6,1fr);padding:2px 4px 6px}.rtool button{background:none;border:0;font-size:10px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.15}.rtool .on{color:var(--accs)}
.aa{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px}
.fs #nav,.fs .rh,.fs .binfo,.fs .rtool{display:none}.fs .rbar{bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}.fs main.rm{padding-bottom:80px}
.fsx{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:12px;font-weight:600}
.th{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;background:radial-gradient(circle at 100% 0,rgba(109,74,245,.35),transparent 60%),var(--card)}
.th h2{font-size:26px;font-weight:800;line-height:1.1}.th small{color:var(--mut);display:block;margin-top:4px}
.rg{position:relative;flex:none;width:64px;height:64px;display:grid;place-items:center;font-weight:800;font-size:13px}.rg svg{position:absolute;inset:0;transform:rotate(-90deg)}
.tc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.tc.lk{opacity:.6}.tc .ti{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--acc)}
.tc.lk .ti{background:var(--c2);color:var(--mut)}.tc.it .ti{background:var(--c2);color:var(--accs)}.tc.k-p .ti{background:#E5484D;color:#fff}.tc.k-v .ti,.tc.k-q .ti{background:var(--acc);color:#fff}
.tb{flex:1;min-width:0}.tb b{display:block;font-size:14.5px;line-height:1.25}.tb small{color:var(--mut);font-size:12px;display:block}
.tp{display:flex;align-items:center;gap:8px;margin-top:6px}.tp .pb{flex:1;height:5px;margin:0}.tp>span{font-size:11px;color:var(--mut)}.ok{color:var(--ok)}
.hr2{border-radius:14px;padding:22px 18px;min-height:170px;background:linear-gradient(135deg,#2B1B7A,#6D4AF5);color:#fff;margin:10px 0 14px;display:flex;align-items:flex-end}.hr2 h3{font-size:30px;font-weight:800;line-height:1.1;max-width:75%}
.dato{border:1.5px solid var(--acc);border-radius:14px;padding:12px 14px;margin:14px 0}.dato b{color:#F5B93A;display:flex;align-items:center;gap:8px;margin-bottom:4px}.dato p{font-size:13px;color:var(--mut)}
.tnv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.tnv .btn{margin:0}.btn.o{background:none;border:1.5px solid var(--acc);color:var(--ink)}.btn:disabled{opacity:.4}

 function mark(c,i){D.ct=D.ct||{};var k=key(c,i);if(D.ct[k])delete D.ct[k];else D.ct[k]={d:new Date().toISOString()};sv();draw()}
